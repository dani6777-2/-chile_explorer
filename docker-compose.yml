# Docker Compose para Chile Explorer
# Opción 1 (por defecto): SQLite local — sin servicios adicionales.
# Opción 2 (EC2/demo): descomentar el servicio MySQL y usar .env con MySQL.
services:
  web:
    build: .
    container_name: chile_explorer
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    restart: unless-stopped
    env_file:
      - .env

