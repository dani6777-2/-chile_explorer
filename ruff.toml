# ─────────────────────────────────────────────────────────────────
#  Ruff — chile_explorer (Django, apps en la raíz)
#  Docs: https://docs.astral.sh/ruff/configuration/
# ─────────────────────────────────────────────────────────────────
target-version = "py314"
line-length = 88

[format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # Ruff-specific
]
ignore = [
    "E501",  # line too long — el formatter se encarga
]

[lint.per-file-ignores]
"**/migrations/*" = ["E501", "N999", "RUF012"]
"**/tests/*" = ["S101"]
"test_*.py" = ["S101"]
"**/settings.py" = ["E501"]

[lint.isort]
known-first-party = ["chile_explorer", "destinos", "gastronomia"]
